services:
  - type: web
    name: smart-campus-placement-portal
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      
      # TiDB Database Configuration (Pre-configured)
      - key: DB_HOST
        value: gateway01.ap-southeast-1.prod.alicloud.tidbcloud.com
      - key: DB_USER
        value: 48mZbxucLdV55MM.root
      - key: DB_PASS
        value: Gj8Oq4L6u5cAmiQ1
      - key: DB_NAME
        value: test
      - key: DB_PORT
        value: "4000"
      
      # Generative AI Configuration (Securely prompted by Render)
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      
      # Flask Security Configuration (Auto-Generated by Render)
      - key: SECRET_KEY
        generateValue: true
      
      # Mail Configuration (Pre-configured for Gmail, fill username/password)
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "True"
      - key: MAIL_USERNAME
        value: your_email@gmail.com
      - key: MAIL_PASSWORD
        sync: false
